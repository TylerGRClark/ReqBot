name: Gemini PR Review

# pull_request_target runs workflow code from main (base branch), not the PR branch.
# This ensures GEMINI_API_KEY is never handed to untrusted PR code.
on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Only run on PRs from this repo's own branches, not from forks.
    # Prevents external contributors from triggering paid Gemini API usage
    # on every PR once the repository is public.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      pull-requests: write
      contents: read

    steps:
      # Checks out main (base branch) — gemini_review.py is always the trusted version
      - name: Checkout base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r .github/scripts/requirements-review.txt

      # Run trusted script from main with diff as input
      - name: Run Gemini Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/gemini_review.py

      - name: Retain structured review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gemini-review-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: review-evidence.json
          if-no-files-found: error
          retention-days: 30
