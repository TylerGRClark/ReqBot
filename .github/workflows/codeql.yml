name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly baseline scan — catches issues introduced by a dependency update alone, not just
    # by a code change in a PR.
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Python: core/, services/, api/, pipeline/, cli/, mcp_server/ — matching the existing
          # pytest --cov module scope. JS/TS: frontend/. Everything else (archive/, docs/, eval/,
          # models/, profiles/, tests/) is out of scope for this scan.
          config: |
            paths:
              - core
              - services
              - api
              - pipeline
              - cli
              - mcp_server
              - frontend

      - id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
          output: sarif-results

      # Missing evidence fails. Effective error level OR high/critical security
      # severity blocks; severity does not establish confidence/precision.
      # Runs on pull_request only: that is the gate for newly introduced findings.
      # Whole-tree scans (push to main, weekly schedule) still upload to the Security
      # tab but do not fail the job -- seven older alerts there were reviewed as false
      # positives, and failing on them kept main red without gating anything.
      - name: Validate CodeQL evidence and severity
        if: github.event_name == 'pull_request'
        env:
          SARIF_DIRECTORY: ${{ steps.analyze.outputs.sarif-output }}
        run: python3 .github/scripts/codeql_gate.py "$SARIF_DIRECTORY"
